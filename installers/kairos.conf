# Kairos node configuration
# Edit this file, then re-run deploy.sh

# Connect to a VPS backbone? (yes/no)
VPS_ENABLED=no

# Only read if VPS_ENABLED=yes
VPS_HOST=""
VPS_PORT=""
VPS_NETWORK_NAME=""
#optional passphrase
VPS_PASSPHRASE=""

#Server only settings for install_server.sh
SERVER_LISTEN_IP=""
SERVER_LIST_PORT=""

# Connect an RNode (LoRa radio)? (yes/no)
RNODE_ENABLED=no

# Only read if RNODE_ENABLED=yes
# Find your port with: ls /dev/ttyUSB* /dev/ttyACM*
RNODE_PORT=""

# Defaults below are standard US 915MHz settings - safe to leave as-is
RNODE_FREQUENCY=
RNODE_BANDWIDTH=
RNODE_TXPOWER=
RNODE_SPREADINGFACTOR=
RNODE_CODINGRATE=

